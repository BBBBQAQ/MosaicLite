name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build and verify release archives
        run: |
          ./scripts/package-release.sh
          file outputs/MosaicLite.app/Contents/MacOS/MosaicLite | grep -q "universal binary"
          ! unzip -Z1 outputs/MosaicLite-*-macos.zip | grep -Eq '(^|/)\._'
